services:
  db:
    image: postgis/postgis:15-3.3
    # postgis 공식 이미지는 arm64 빌드가 없어 Apple Silicon에서는 amd64 에뮬레이션으로 실행
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # 컨테이너를 다시 만들어도 적재한 링크·수집 데이터가 남도록 named volume에 저장
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "traffic", "-d", "trafficdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 localhost가 자기 자신이므로 서비스 이름을 호스트로 사용
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  
volumes:
  postgres_data: